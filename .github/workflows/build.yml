name: Build FakePlayer 26.2

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Restore JDK 21 for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build plugin
        run: |
          chmod +x ./gradlew
          ./gradlew :fakeplayer-dist:shadowJar

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: fakeplayer-minecraft-26.2
          path: target/libs/*.jar
          if-no-files-found: error
